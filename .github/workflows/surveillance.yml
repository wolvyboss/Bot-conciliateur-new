name: Surveillance conciliateur

on:
  schedule:
    - cron: "*/5 6-21 * * *"    # toutes les 5 min, de 7h à 23h (heure de Paris en hiver, cron en UTC)
  workflow_dispatch:             # bouton "Run workflow" pour tester à la main
    inputs:
      test_sms:
        description: "Envoyer un SMS de test"
        type: boolean
        default: false

permissions:
  contents: write                # pour mémoriser les créneaux déjà signalés

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Vérifier les créneaux
        env:
          FREE_USER: ${{ secrets.FREE_USER }}
          FREE_PASS: ${{ secrets.FREE_PASS }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          TEST_SMS: ${{ inputs.test_sms }}
        run: python bot.py
      - name: Sauvegarder la mémoire
        run: |
          if [ -n "$(git status --porcelain state.json snapshots historique.csv 2>/dev/null)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json historique.csv snapshots 2>/dev/null || git add -A
            git commit -m "maj etat"
            git push
          fi
